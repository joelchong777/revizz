<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <pattern id="sprint-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#BAE6FD" stroke-width="1" opacity="0.6"/>
    </pattern>
    <filter id="trophy-shadow" x="0" y="0" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#201e1d" flood-opacity="1"/>
    </filter>
    <filter id="btn-shadow-sprint" x="0" y="0" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#201e1d" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="360" fill="#F0F9FF"/>
  <rect width="600" height="360" fill="url(#sprint-grid)"/>

  <!-- Left Accent Strip -->
  <rect x="0" y="0" width="12" height="360" fill="#0284C7"/>

  <!-- Main Container Layout -->
  <g transform="translate(32, 28)">
    <!-- Top Row: Badge & Streak Flame Pill -->
    <g>
      <rect x="0" y="0" width="180" height="30" rx="15" fill="#FEF3C7" stroke="#201e1d" stroke-width="2.2" filter="url(#btn-shadow-sprint)"/>
      <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#92400E" letter-spacing="1">🔥 7-DAY CHALLENGE</text>

      <rect x="195" y="0" width="130" height="30" rx="15" fill="#FFFFFF" stroke="#201e1d" stroke-width="2" filter="url(#btn-shadow-sprint)"/>
      <text x="210" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#201e1d">⚡ 2X XP BOOST</text>
    </g>

    <!-- Headline -->
    <text x="0" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#201e1d" letter-spacing="-0.5">
      FIRST-TRY ACCURACY
    </text>
    <text x="0" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#0284C7" letter-spacing="-0.5">
      MASTERY SPRINT
    </text>

    <!-- Subtitle -->
    <text x="0" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#4B5563">
      Practice untimed topic drills &amp; unlock gold Cambridge medals.
    </text>

    <!-- Stats Badges -->
    <g transform="translate(0, 172)">
      <rect x="0" y="0" width="105" height="42" rx="10" fill="#FFFFFF" stroke="#201e1d" stroke-width="2" filter="url(#btn-shadow-sprint)"/>
      <text x="12" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#6B7280">TARGET</text>
      <text x="12" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#201e1d">15 Qs / Day</text>

      <rect x="115" y="0" width="105" height="42" rx="10" fill="#FFFFFF" stroke="#201e1d" stroke-width="2" filter="url(#btn-shadow-sprint)"/>
      <text x="127" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#6B7280">REWARD</text>
      <text x="127" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#EA580C">+500 XP</text>
    </g>

    <!-- CTA Button -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="220" height="44" rx="12" fill="#0284C7" stroke="#201e1d" stroke-width="2.5" filter="url(#btn-shadow-sprint)"/>
      <text x="40" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">
        START SPRINT →
      </text>
    </g>

    <!-- Right 3D Trophy & Stars Artwork -->
    <g transform="translate(365, 30)">
      <!-- Trophy Card Frame -->
      <rect x="0" y="0" width="170" height="240" rx="20" fill="#FFFFFF" stroke="#201e1d" stroke-width="2.5" filter="url(#trophy-shadow)"/>
      <rect x="0" y="0" width="170" height="28" rx="20" fill="#BAE6FD"/>
      <rect x="0" y="14" width="170" height="14" fill="#BAE6FD"/>
      <line x1="0" y1="28" x2="170" y2="28" stroke="#201e1d" stroke-width="2"/>
      <text x="85" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#0369A1" text-anchor="middle">MASTERY TROPHY</text>

      <!-- Trophy Graphic -->
      <!-- Cup Body -->
      <path d="M 50 65 L 120 65 L 115 125 C 115 145, 55 145, 55 125 Z" fill="#FACC15" stroke="#201e1d" stroke-width="2.5"/>
      <!-- Inner Cup highlight -->
      <path d="M 60 72 L 75 72 L 72 120 C 72 125, 62 125, 62 120 Z" fill="#FEF08A"/>

      <!-- Handles -->
      <path d="M 50 75 C 30 75, 30 110, 53 110" fill="none" stroke="#201e1d" stroke-width="2.5"/>
      <path d="M 120 75 C 140 75, 140 110, 117 110" fill="none" stroke="#201e1d" stroke-width="2.5"/>

      <!-- Stem -->
      <rect x="78" y="138" width="14" height="22" fill="#EAB308" stroke="#201e1d" stroke-width="2"/>

      <!-- Base -->
      <rect x="52" y="160" width="66" height="20" rx="6" fill="#D97706" stroke="#201e1d" stroke-width="2.5"/>
      <rect x="42" y="180" width="86" height="20" rx="6" fill="#201e1d"/>
      <text x="85" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">★ GOLD ★</text>

      <!-- Star & Sparkles -->
      <polygon points="85,82 89,93 100,93 91,100 95,111 85,104 75,111 79,100 70,93 81,93" fill="#FFFFFF" stroke="#201e1d" stroke-width="1.5"/>
      <circle cx="28" cy="48" r="4" fill="#F59E0B" stroke="#201e1d" stroke-width="1"/>
      <circle cx="145" cy="52" r="3" fill="#38BDF8" stroke="#201e1d" stroke-width="1"/>
    </g>
  </g>
</svg>
